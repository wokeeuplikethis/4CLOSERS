<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="50%" style="stop-color:#121212"/>
      <stop offset="100%" style="stop-color:#060606"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF3D00"/>
      <stop offset="100%" style="stop-color:#FF6B3D"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#noise)" opacity="0.03"/>
  <circle cx="960" cy="540" r="400" fill="url(#accent)" opacity="0.05"/>
  <circle cx="960" cy="540" r="280" fill="url(#accent)" opacity="0.08"/>
  <circle cx="960" cy="540" r="160" fill="url(#accent)" opacity="0.12"/>
  <text x="960" y="500" font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="url(#accent)" text-anchor="middle" letter-spacing="-2">4CLOSERS</text>
  <text x="960" y="570" font-family="system-ui, sans-serif" font-size="24" font-weight="500" fill="#FF3D00" text-anchor="middle" letter-spacing="4">SAINT-PETERSBURG</text>
  <text x="960" y="640" font-family="system-ui, sans-serif" font-size="16" fill="#666" text-anchor="middle">HERO PLACEHOLDER — REPLACE WITH REAL PHOTO</text>
  <rect x="860" y="720" width="200" height="2" fill="url(#accent)" opacity="0.3"/>
</svg>