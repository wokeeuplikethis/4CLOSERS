<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E0E0E"/>
      <stop offset="100%" style="stop-color:#060606"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF3D00"/>
      <stop offset="100%" style="stop-color:#FF6B3D"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#noise)" opacity="0.05"/>
  <circle cx="400" cy="300" r="120" fill="url(#accent)" opacity="0.08"/>
  <text x="400" y="280" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="url(#accent)" text-anchor="middle" letter-spacing="-1">4CLOSERS</text>
  <text x="400" y="320" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#FF3D00" text-anchor="middle" letter-spacing="2">SPB</text>
  <text x="400" y="360" font-family="system-ui, sans-serif" font-size="14" fill="#555" text-anchor="middle">EQUIPMENT 4 — PLACEHOLDER</text>
  <rect x="350" y="400" width="100" height="1" fill="url(#accent)" opacity="0.3"/>
</svg>
